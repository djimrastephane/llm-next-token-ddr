[project]
name = "llm-next-token-ddr"
version = "0.1.0"
description = "Capture real next-token inference traces from a local LLM and animate them (Daily Drilling Report example)."
requires-python = ">=3.11"
# Compatible ranges; requirements.txt pins the exact tested versions. transformers 5 is required (dtype= argument).
dependencies = ["torch>=2.14,<3", "transformers>=5.17,<6", "numpy>=2.4,<3", "safetensors>=0.8"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=9.1", "ruff>=0.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads a real model (needs cached weights)"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["node_modules", ".venv", "out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E702", "B905"]
