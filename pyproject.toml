[project]
name = "llm-next-token-ddr"
version = "0.1.0"
description = "Capture real next-token inference traces from a local LLM and animate them (Daily Drilling Report example)."
requires-python = ">=3.11"
dependencies = ["torch>=2.3", "transformers>=4.44", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["node_modules", ".venv", "out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E702", "B905"]
